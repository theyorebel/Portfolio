<!DOCTYPE html>
<html>
<head>
    <title>Registration Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    body {
    font-family: Arial, sans-serif;
    background-color: #e6f0ff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.container {
    background-color: white;
    width: 300px;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 4px 12px gray;
}

h2 {
    text-align: center;
    color: #333399;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

input[type="text"],
input[type="email"],
input[type="password"],
select {
    width: 100%;
    padding: 9px;
    margin-top: 5px;
    box-sizing: border-box;
    border: 1px solid #aaa;
    border-radius: 5px;
}

.gender {
    margin-top: 8px;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 5px;
    background-color: #333399;
    color: white;
    cursor: pointer;
}

button:hover {
    background-color: #5555cc;
}
    </style>

<body>

    <div class="container">
        <h2>Registration Form</h2>

        <form>
            <label>Full Name:</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Email:</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Password:</label>
            <input type="password" placeholder="Enter password" required>

            <label>Gender:</label>
            <div class="gender">
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
            </div>

            <label>City:</label>
            <select>
                <option>Select City</option>
                <option>Delhi</option>
                <option>Mumbai</option>
                <option>Bengaluru</option>
                <option>Patna</option>
            </select>

            <label>Batch:</label>
            <select>
                <option>Select Batch</option>
                <option>2026</option>
                <option>2027</option>
                <option>2028</option>
                <option>2029</option>
            </select>

            <div class="buttons">
                <button type="submit">Register</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </div>

</body>
</html>
